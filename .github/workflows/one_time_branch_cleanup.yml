name: One-time verified legacy-branch cleanup
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-redundant-branches:
    if: "github.event.head_commit.message == 'chore: finalize one-main branch [branch-cleanup-once]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research test dependencies
        run: python -m pip install "numpy>=1.24,<3" "pandas>=2,<3" "scikit-learn>=1.4,<2" "arch>=7,<9"
      - name: Verify final research release
        run: |
          python -m unittest discover -s tests -v
          python main.py --verify-v22
          python scripts/build_v22_dashboard.py --out /tmp/verified-china-volatility.html
      - name: Delete only the two fully merged research branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected=c4d69744f7a77e9ca23f380d1f4a396f191cc2fa
          git merge-base --is-ancestor "$expected" HEAD
          for branch in "research/phase1-2-data-timing-2026-10-12" "audit/v22-readme-results-alignment"; do
            current=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')
            if [ "$current" != "$expected" ]; then
              echo "Refusing deletion: ${branch} changed to ${current}"
              exit 1
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
          gh api "repos/${GITHUB_REPOSITORY}/branches" --jq '.[].name'
