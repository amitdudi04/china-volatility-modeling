name: Research v2 timing and target checks
on:
  push:
    branches:
      - "research/**"
  pull_request:

jobs:
  research-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal research-design dependencies
        run: python -m pip install "numpy>=1.24,<3" "pandas>=2,<3" "scikit-learn>=1.4,<2" "arch>=7,<9"
      - name: Run deterministic causality and target tests
        run: python -m unittest discover -s tests -v
